<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LMTD Calculator - Minimal</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .card { background: #f9f9f9; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
        .row { display: flex; gap: 10px; margin-bottom: 8px; }
        .col { flex: 1; }
        label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #000; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #333; }
        .result { font-size: 18px; font-weight: bold; color: #007bff; margin: 15px 0; padding: 10px; background: #eef7ff; border-left: 4px solid #007bff; }
        .chart-wrapper { width: 100%; height: 350px; background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Калькулятор LMTD</h2>
    <div class="grid">
        <div class="card">
            <h4>Горячая среда</h4>
            <div class="row"><div class="col"><label>T1 (вход)</label><input type="number" id="T1" value="70"></div>
            <div class="col"><label>T2 (выход)</label><input type="number" id="T2" value="50"></div></div>
        </div>
        <div class="card">
            <h4>Холодная среда</h4>
            <div class="row"><div class="col"><label>t1 (вход)</label><input type="number" id="t1" value="20"></div>
            <div class="col"><label>t2 (выход)</label><input type="number" id="t2" value="49"></div></div>
        </div>
    </div>
    <div style="display:flex; gap:10px; align-items:end;">
        <select id="flowType" style="padding:8px; border-radius:4px;">
            <option value="parallel">Прямоток</option>
            <option value="counter">Противоток</option>
        </select>
        <button onclick="calc()">Рассчитать LMTD и график</button>
    </div>
    <div class="result" id="res">LMTD = ... °C</div>
    <div class="chart-wrapper">
        <canvas id="chart"></canvas>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let myChart = null;
    function calc() {
        const T1 = +document.getElementById('T1').value;
        const T2 = +document.getElementById('T2').value;
        const t1 = +document.getElementById('t1').value;
        const t2 = +document.getElementById('t2').value;
        const type = document.getElementById('flowType').value;
        const elRes = document.getElementById('res');
        
        let dT1, dT2;
        if (type === 'counter') {
            dT1 = T1 - t2;
            dT2 = T2 - t1;
        } else {
            dT1 = T1 - t1;
            dT2 = T2 - t2;
        }
        
        if (dT1 <= 0 || dT2 <= 0) {
            elRes.textContent = "Ошибка: ΔT ≤ 0";
            elRes.style.borderLeftColor = "#dc3545";
            return;
        }
        
        const lmtd = Math.abs(dT1 - dT2) < 0.001 ? dT1 : (dT1 - dT2) / Math.log(dT1 / dT2);
        elRes.textContent = "LMTD = " + lmtd.toFixed(2) + " °C";
        elRes.style.borderLeftColor = "#007bff";
        
        // Данные для графика
        const hot = [T1, T2];
        const cold = type === 'counter' ? [t2, t1] : [t1, t2];
        // Убраны подписи "Вход" и "Выход" — теперь оси без текстовых меток
        const labels = ['', '']; 
        
        const ctx = document.getElementById('chart').getContext('2d');
        if (myChart) myChart.destroy();
        
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Горячая среда', data: hot, borderColor: '#dc3545', fill: false, tension: 0.3, pointRadius: 5 },
                    { label: 'Холодная среда', data: cold, borderColor: '#0d6efd', fill: false, tension: 0.3, pointRadius: 5 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top' } },
                scales: { 
                    x: { 
                        grid: { display: false },
                        ticks: { display: false } // Полностью скрываем подписи оси X
                    },
                    y: { beginAtZero: false, min: 0 } 
                }
            }
        });
    }
    window.onload = calc;
</script>
</body>
</html>
