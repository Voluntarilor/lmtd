<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LMTD Calculator</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      .block { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; }
      .col { flex: 1; min-width: 200px; }
      label { display: block; margin-top: 0.5rem; font-weight: 500; }
      input, select { padding: 0.75rem; width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; }
      button { background: #000; color: #fff; border: none; padding: 0.75rem 1rem; cursor: pointer; width: 100%; }
      .result { margin-top: 1rem; font-weight: bold; }
      canvas { width: 100%; height: 300px; border: 1px solid #ddd; background: #fafafa; }
    </style>
  </head>
  <body>
    <h1>LMTD Calculator</h1>

    <div class="block">
      <h3>Режим 1</h3>
      <div class="row">
        <div class="col">
          <label>Тип потока</label>
          <select id="flowType1">
            <option value="counter">Противоток</option>
            <option value="parallel">Прямоток</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>T1 (вход горячей, °C)</label>
          <input type="number" id="t1_1" placeholder="90">
        </div>
        <div class="col">
          <label>T2 (выход горячей, °C)</label>
          <input type="number" id="t2_1" placeholder="60">
        </div>
        <div class="col">
          <label>T3 (вход холодной, °C)</label>
          <input type="number" id="t3_1" placeholder="30">
        </div>
        <div class="col">
          <label>T4 (выход холодной, °C)</label>
          <input type="number" id="t4_1" placeholder="50">
        </div>
      </div>
      <button onclick="calculate(1)">Рассчитать LMTD</button>
      <div class="result" id="result1"></div>
      <canvas id="chart1"></canvas>
    </div>

    <div class="block">
      <h3>Режим 2</h3>
      <div class="row">
        <div class="col">
          <label>Тип потока</label>
          <select id="flowType2">
            <option value="counter">Противоток</option>
            <option value="parallel">Прямоток</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>T1 (вход горячей, °C)</label>
          <input type="number" id="t1_2" placeholder="85">
        </div>
        <div class="col">
          <label>T2 (выход горячей, °C)</label>
          <input type="number" id="t2_2" placeholder="55">
        </div>
        <div class="col">
          <label>T3 (вход холодной, °C)</label>
          <input type="number" id="t3_2" placeholder="35">
        </div>
        <div class="col">
          <label>T4 (выход холодной, °C)</label>
          <input type="number" id="t4_2" placeholder="55">
        </div>
      </div>
      <button onclick="calculate(2)">Рассчитать LMTD</button>
      <div class="result" id="result2"></div>
      <canvas id="chart2"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      function calculate(mode) {
        const prefix = mode === 1 ? '1' : '2';
        const t1 = parseFloat(document.getElementById('t1_' + prefix).value);
        const t2 = parseFloat(document.getElementById('t2_' + prefix).value);
        const t3 = parseFloat(document.getElementById('t3_' + prefix).value);
        const t4 = parseFloat(document.getElementById('t4_' + prefix).value);
        const flowType = document.getElementById('flowType' + prefix).value;
        const resultEl = document.getElementById('result' + prefix);
        const canvas = document.getElementById('chart' + prefix);

        if (isNaN(t1) || isNaN(t2) || isNaN(t3) || isNaN(t4)) {
          resultEl.textContent = 'Введите все значения';
          return;
        }

        let dT1, dT2;
        if (flowType === 'counter') {
          dT1 = t1 - t4;
          dT2 = t2 - t3;
        } else {
          dT1 = t1 - t3;
          dT2 = t2 - t4;
        }

        if (dT1 <= 0 || dT2 <= 0) {
          resultEl.textContent = 'Проверьте корректность температур (дельты должны быть > 0)';
          return;
        }

        let lmtd;
        let method = '';

        if (Math.abs(dT1 - dT2) < 0.0001) {
          lmtd = dT1;
          method = 'ΔT₁ ≈ ΔT₂, LMTD = ΔT';
        } else if (dT1 / dT2 <= 2 || dT2 / dT1 <= 2) {
          lmtd = (dT1 + dT2) / 2;
          method = 'среднеарифметическое (ΔT₁/ΔT₂ ≤ 2)';
        } else {
          lmtd = (dT1 - dT2) / Math.log(dT1 / dT2);
          method = 'точная формула';
        }

        resultEl.textContent = `LMTD = ${lmtd.toFixed(2)} °C (${flowType === 'counter' ? 'противоток' : 'прямоток'}, \${method})`;

        drawChart(canvas, t1, t2, t3, t4, flowType);
      }

      function drawChart(canvas, t1, t2, t3, t4, flowType) {
        const ctx = canvas.getContext('2d');

        // Для стрелок используем аннотации — Chart.js не умеет рисовать стрелки на линиях,
        // поэтому рисуем их вручную поверх графика
        const drawArrow = (ctx, fromX, fromY, toX, toY, color, size = 10) => {
          const angle = Math.atan2(toY - fromY, toX - fromX);
          ctx.beginPath();
          ctx.moveTo(fromX, fromY);
          ctx.lineTo(toX, toY);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.stroke();

          // Стрелка
          const arrowLength = size;
          const dx = Math.cos(angle - Math.PI / 6) * arrowLength;
          const dy = Math.sin(angle - Math.PI / 6) * arrowLength;
          const dx2 = Math.cos(angle + Math.PI / 6) * arrowLength;
          const dy2 = Math.sin(angle + Math.PI / 6) * arrowLength;

          ctx.beginPath();
          ctx.moveTo(toX, toY);
          ctx.lineTo(toX + dx, toY + dy);
          ctx.lineTo(toX + dx2, toY + dy2);
          ctx.fillStyle = color;
          ctx.fill();
        };

        // Промежуточные точки для более точного отображения (линейная интерполяция)
        const midHot = (t1 + t2) / 2;
        const midCold = (t3 + t4) / 2;

        let hotData, coldData;
        if (flowType === 'counter') {
          // Противоток: горячая — слева направо, холодная — справа налево
          hotData = [t1, midHot, t2];
          coldData = [t4, midCold, t3];
        } else {
          // Прямоток: обе слева направо
          hotData = [t1, midHot, t2];
          coldData = [t3, midCold, t4];
        }

        const chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Вход', 'Середина', 'Выход'],
            datasets: [
              {
                label: 'Горячая среда',
                data: hotData,
                borderColor: 'red',
                tension: 0.4,
                fill: false,
                pointRadius: 4,
                pointBackgroundColor: 'white',
                pointBorderColor: 'red',
                pointBorderWidth: 2
              },
              {
                label: 'Холодная среда',
                data: coldData,
                borderColor: 'blue',
                tension: 0.4,
                fill: false,
                pointRadius: 4,
                pointBackgroundColor: 'white',
                pointBorderColor: 'blue',
                pointBorderWidth: 2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false, grid: { color: '#e0e0e0' } },
              x: { grid: { display: false } }
            },
            plugins: {
              legend: { position: 'top' },
              tooltip: { mode: 'index', intersect: false }
            },
            onComplete: function() {
              // Рисуем стрелки поверх графика
              const width = canvas.width;
              const height = canvas.height;
              const xScale = this.scales['x'];
              const yScale = this.scales['y'];

              const getX = (label) => xScale.getPixelForValue(label);
              const getY = (value) => yScale.getPixelForValue(value);

              // Стрелки для горячей среды
              const hStartX = getX('Вход');
              const hStartY = getY(hotData);
              const hEndX = getX('Выход');
              const hEndY = getY(hotData);
              drawArrow(ctx, hStartX, hStartY, hEndX, hEndY, 'red', 12);

              // Стрелки для холодной среды
              const cStartX = getX('Вход');
              const cStartY = getY(coldData);
              const cEndX = getX('Выход');
              const cEndY = getY(coldData);
              drawArrow(ctx, cStartX, cStartY, cEndX, cEndY, 'blue', 12);
            }
          }
        });
      }
    </script>
  </body>
</html>
